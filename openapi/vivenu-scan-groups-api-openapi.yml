        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  description: The name of the scan group.
                scanConfig:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum:
                      - lock
                      - default
                      description: The mode of the scan config.
                    events:
                      description: The events settings of the scan config.
                      type: array
                      items:
                        type: object
                        properties:
                          eventId:
                            type: string
                            description: The ID of the event.
                          allowAllTicketTypes:
                            description: Whether an all ticket type available or not.
                            default: false
                            type: boolean
                          allowedTicketTypeIds:
                            description: The array of the allowed ticket type IDs.
                            type: array
                            items:
                              type: string
                          timeslotSettings:
                            type: object
                            properties:
                              beforeMinutes:
                                description: Minutes before a timeslot when tickets become valid for this event.
                                default: 0
                                type: number
