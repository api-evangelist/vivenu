                            additionalProperties: false
                        required:
                        - eventId
                        additionalProperties: false
                    scanZoneId:
                      description: The ID of the scan zone.
                      type: string
                    scanTypes:
                      oneOf:
                      - type: object
                        properties:
                          checkin:
                            type: boolean
                            enum:
                            - true
                            description: Whether check-in scanning is enabled.
                          checkout:
                            type: boolean
                            description: Whether check-out scanning is enabled.
                        required:
                        - checkin
                        - checkout
                        additionalProperties: false
                      - type: object
                        properties:
                          checkin:
                            type: boolean
                            enum:
                            - false
                            description: Whether check-in scanning is enabled.
                          checkout:
                            type: boolean
                            enum:
                            - true
                            description: Whether check-out scanning is enabled.
                        required:
                        - checkin
