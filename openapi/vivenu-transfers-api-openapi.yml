  /api/customers/transfers/bulk:
    patch:
      security:
      - jwt: []
      - apikey: []
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
                additionalProperties: false
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '404':
          description: Not Found
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    type: string
                    pattern: ^[a-z]+_.*$
                  description: Ids of transfers that should be updated
                status:
                  type: string
                  enum:
                  - PENDING
                  - PROCESSING
                  - SUCCEEDED
                  - FAILED
                  description: The new status for the transfer
              required:
              - ids
              - status
              additionalProperties: false
      tags:
      - transfers
      description: Update Status of Transfers
      operationId: update_status_of_transfers
components:
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apikey:
      type: apiKey
      scheme: bearer
      in: header
      name: Authorization
    customer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    orgApiKey:
      type: apiKey
      scheme: bearer
      in: header
      name: Authorization
