      description: Get Transfer
      operationId: get_transfer
    put:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        schema:
          type: string
        required: true
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  _id:
                    type: string
                  sellerId:
                    type: string
                  customerId:
                    type: string
                  reference:
                    type: string
                  amount:
                    type: number
                  currency:
                    type: string
                    enum:
                    - EUR
