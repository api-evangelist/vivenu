  /api/transactions/{id}/cancellations:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          description: The ID of the transaction
          metas: {}
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GET_Transactions_GetTransactionCancellationInfo_200_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - transactions
      description: Get Transaction cancellation info
      operationId: get_transaction_cancellation_info
    post:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          description: The ID of the transaction
          metas: {}
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POST_Transactions_CreateATransactionCancellation_200_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  anyOf:
                  - type: array
                    items:
                      type: string
                  - type: array
                    items:
                      type: object
                      properties:
                        _id:
                          type: string
                        amount:
                          default: 0
                          type: number
                      required:
                      - _id
                      - amount
                      additionalProperties: false
                refundFunds:
                  default: false
                  description: Whether the received funds should be refunded
                  type: boolean
                refundTarget:
                  default: origin
                  description: The method to use for refunding the transaction.
                  type: string
                  enum:
                  - origin
                  - voucher
              required:
              - items
              - refundFunds
              - refundTarget
              additionalProperties: false
      tags:
      - transactions
      description: Create a Transaction cancellation
      operationId: create_a_transaction_cancellation
  /api/public/tickets/{id}/transaction:
