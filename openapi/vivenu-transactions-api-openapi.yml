openapi: 3.0.3
info:
  title: vivenu access-lists transactions API
  description: vivenu API Documentation
  version: 1.0.0
  contact:
    name: vivenu GmbH
    url: https://vivenu.com
servers:
- url: https://vivenu.com
  description: Production API
- url: https://vivenu.dev
  description: Staging API
tags:
- name: transactions
paths:
  /api/transactions:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: name
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: email
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: coupon
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: start
        required: false
        schema:
          type: string
          format: date-time
          metas: {}
        in: query
        style: form
        explode: true
      - name: end
        required: false
        schema:
          type: string
          format: date-time
          metas: {}
        in: query
        style: form
        explode: true
      - name: status
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: paymentStatus
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: posPaymentMethods
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: event
        required: false
        schema:
          type: string
          description: Filter by a comma(,) separated list of event IDs
          metas: {}
        in: query
        style: form
        explode: true
      - name: customer
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: subscriptionId
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: updatedAt
        required: false
        schema:
          type: object
          properties:
            $gt:
              type: string
              format: date-time
              description: value is greater than
              metas: {}
            $gte:
              type: string
              format: date-time
              description: value is greater than or equal
              metas: {}
            $lt:
              type: string
              format: date-time
              description: value is less than
              metas: {}
            $lte:
              type: string
              format: date-time
              description: value is less than or equal
              metas: {}
            $eq:
              type: string
              format: date-time
              description: value is equal
              metas: {}
            $ne:
              type: string
              format: date-time
              description: value is not equal
              metas: {}
          description: Range of dates indicating when the transaction was last updated in ISO format.
          metas: {}
        in: query
        style: deepObject
        explode: true
      - name: psp
        required: false
        schema:
          type: string
          description: The reference of the payment service provider to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: top
        required: false
        schema:
          type: integer
          maximum: 1000
          description: A limit on the number of objects to be returned. Can range between 1 and 1000.
          default: 25
          metas: {}
        in: query
        style: form
        explode: true
      - name: skip
        required: false
        schema:
          type: integer
          description: The number of objects to skip for the requested result
          metas: {}
        in: query
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GET_Transactions_GetAllTransactions_200_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - transactions
      description: Get All Transactions
      operationId: get_all_transactions
