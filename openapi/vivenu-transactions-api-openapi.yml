      description: Get all Transactions rich
      deprecated: true
      operationId: get_all_transactions_rich
  /api/transactions/{id}:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          metas: {}
