      operationId: cancel_pos_transaction
components:
  schemas:
    POST_Transactions_AddHistoryEntry:
      type: object
      properties:
        type:
          type: string
          enum:
          - commented
        data:
          type: object
          properties:
            comment:
              type: string
          required:
          - comment
      required:
      - type
      - data
    GET_Transactions_GetTransactionCancellationInfo_200_response:
      type: object
      properties:
        cancellableItems:
          type: array
          items:
            type: object
            properties:
              cartItemId:
                type: string
                description: The ID of the cart to which the item belongs to
              type:
                type: string
                enum:
                - ticket
                - product
                - fee
                - discount
                - fulfillment
                - insurance
                description: The type of the item indicated where it originated from
              name:
                type: string
                nullable: true
                description: The name of the item
              price:
                type: number
                format: float
                description: The price of the item
              taxRate:
                type: number
                format: float
                description: The applied tax rate for that item
              origin:
                oneOf:
                - type: object
                  properties:
                    fee:
                      type: object
                      properties:
                        _id:
                          type: string
                          description: The ID of the fee component.
                        amount:
                          type: number
                          format: float
                          description: The fee amount.
                        value:
                          type: number
                          format: float
                          description: The fee value.
                        total:
                          type: number
                          format: float
                          description: The fee total. Calculated with amount and value.
                        type:
                          type: string
                          enum:
                          - onTicket
                          - onHardTicket
                          - onCart
                          description: The fee type of the fee component.
                        name:
                          type: string
                          nullable: true
                          description: The name of the fee.
                        publicName:
                          type: string
                          description: The public name of the fee component.
                        exposed:
                          type: boolean
                          description: Whether this fee will be exposed to the ticket buyer.
                        scheme:
                          type: object
                          properties:
                            schemeId:
                              type: string
                              description: The ID of the fee scheme.
                            feeId:
                              type: string
                              description: The ID of the fee scheme fee.
                          description: The fee scheme of the fee component.
                      required:
                      - _id
                      description: The cancellation fee of the item
                - type: object
                  properties:
                    ticketTypeId:
                      type: string
                      description: The ID of the ticket type this ticket inherits from
                - type: object
                  properties:
                    productVariantId:
                      type: string
                      description: The ID of the product variant this product inherits from
                description: Object indicating where the item originated from
              cancellationFee:
                type: object
                properties:
                  _id:
                    type: string
                    description: The ID of the fee component.
                  amount:
                    type: number
                    format: float
                    description: The fee amount.
                  value:
                    type: number
                    format: float
                    description: The fee value.
                  total:
                    type: number
                    format: float
                    description: The fee total. Calculated with amount and value.
                  type:
                    type: string
                    enum:
                    - onTicket
                    - onHardTicket
                    - onCart
                    description: The fee type of the fee component.
                  name:
                    type: string
                    nullable: true
                    description: The name of the fee.
                  publicName:
                    type: string
                    description: The public name of the fee component.
                  exposed:
                    type: boolean
                    description: Whether this fee will be exposed to the ticket buyer.
                  scheme:
                    type: object
                    properties:
                      schemeId:
                        type: string
                        description: The ID of the fee scheme.
                      feeId:
                        type: string
                        description: The ID of the fee scheme fee.
                    description: The fee scheme of the fee component.
                required:
                - _id
                description: The cancellation fee of the item. Is set when cancellation fees are charged at cancellation
              refundId:
                type: string
