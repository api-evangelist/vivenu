      operationId: transactions/addHistoryComment
  /api/pos/{id}/cancel/{transactionId}:
    post:
      security:
      - jwt: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          metas: {}
        in: path
      - name: transactionId
        required: true
        schema:
          type: string
          metas: {}
