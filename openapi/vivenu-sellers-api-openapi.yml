      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - RKSV_FON_CREDENTIALS
          participantId:
            type: string
            maxLength: 12
            minLength: 8
          userId:
            type: string
            maxLength: 12
            minLength: 5
          userPin:
            type: string
            maxLength: 128
            minLength: 5
        required:
