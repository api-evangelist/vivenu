        - userPin
      - type: object
        properties:
          type:
            type: string
            enum:
            - ES_TAX_PAYER_CREATION
          content:
            type: object
            properties:
              issuer:
                type: object
                properties:
                  legal_name:
                    type: string
                    maxLength: 120
                    minLength: 1
                  tax_number:
                    type: string
                    pattern: ^(([A-Za-z][0-9]{7}[A-Za-z])|([0-9]{8}[A-Za-z])|([A-Za-z][0-9]{8}))$
                    length: 9
                required:
                - legal_name
                - tax_number
              territory:
                type: string
                enum:
                - ARABA
                - BIZKAIA
                - GIPUZKOA
                - NAVARRE
                - CANARY_ISLANDS
                - CEUTA
                - MELILLA
                - SPAIN_OTHER
              address:
                type: object
                properties:
                  municipality:
                    type: string
                    maxLength: 120
                    minLength: 1
                  city:
                    type: string
                    maxLength: 120
                    minLength: 1
                  street:
                    type: string
                    maxLength: 120
                    minLength: 1
                  number:
                    type: string
                    maxLength: 20
                    minLength: 1
                  postal_code:
                    type: string
                    maxLength: 20
                    minLength: 1
                  country_code:
                    type: string
                    length: 2
                required:
                - municipality
                - city
                - street
                - number
                - postal_code
                - country_code
              email:
                type: string
                format: email
            required:
            - issuer
            - territory
          metadata:
            oneOf:
            - type: array
            - type: boolean
            - type: number
            - type: object
            - type: string
        required:
        - type
        - content
      - type: object
        properties:
          type:
            type: string
            enum:
            - ES_AGREEMENT_GENERATION
          content:
            type: object
            properties:
              representative:
                type: object
                properties:
                  full_name:
                    type: string
                    maxLength: 120
                    minLength: 1
                  tax_number:
                    type: string
                    pattern: ^(([A-Za-z][0-9]{7}[A-Za-z])|([0-9]{8}[A-Za-z])|([A-Za-z][0-9]{8}))$
                    length: 9
                  address:
                    type: object
                    properties:
                      municipality:
                        type: string
                        maxLength: 120
                        minLength: 1
                      city:
                        type: string
                        maxLength: 120
                        minLength: 1
                      street:
                        type: string
                        maxLength: 120
                        minLength: 1
                      number:
                        type: string
                        maxLength: 20
                        minLength: 1
                      postal_code:
                        type: string
                        maxLength: 20
                        minLength: 1
                      country_code:
                        type: string
                        length: 2
                    required:
