            - DRAFT
            - ACTIVE
            - INCOMPLETE
            - CANCELED
            - COMPLETED
            metas: {}
          metas: {}
        in: query
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GET_Payment-plans_ListPaymentPlans_200_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - payment-plans
      description: List Payment Plans
      operationId: list_payment_plans
  /api/payments/plans/{id}:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          metas: {}
        in: path
      responses:
