openapi: 3.0.3
info:
  title: vivenu access-lists purchaseintents API
  description: vivenu API Documentation
  version: 1.0.0
  contact:
    name: vivenu GmbH
    url: https://vivenu.com
servers:
- url: https://vivenu.com
  description: Production API
- url: https://vivenu.dev
  description: Staging API
tags:
- name: purchaseintents
paths:
  /api/purchaseintents:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: customerId
        required: false
        schema:
          type: string
          description: The customer id to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: status
        required: false
        schema:
          type: string
          description: The status to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: approvalStatus
        required: false
        schema:
          type: string
          description: The approval status to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: name
        required: false
        schema:
          type: string
          description: The name to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: eventId
        required: false
        schema:
          type: string
          description: The event id to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: shopId
        required: false
        schema:
          type: string
          description: The secret shop id to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: createdAtStart
        required: false
        schema:
          type: string
          description: An ISO timestamp from which to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: createdAtEnd
        required: false
        schema:
          type: string
          description: An ISO timestamp until which to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: outcomeCheckoutId
        required: false
        schema:
          type: string
          description: The resulting checkout id.
          metas: {}
        in: query
        style: form
        explode: true
      - name: top
        required: false
        schema:
          type: integer
          maximum: 1000
          description: A limit on the number of objects to be returned. Can range between 1 and 1000.
          default: 25
          metas: {}
        in: query
        style: form
        explode: true
      - name: skip
        required: false
        schema:
          type: integer
          description: The number of objects to skip for the requested result
          metas: {}
        in: query
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GET_Purchaseintents_GetAllPurchaseIntents_200_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - purchaseintents
      description: Get all PurchaseIntents
      operationId: purchaseintents/list
    post:
      security:
      - jwt: []
      - apikey: []
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseIntentResource'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POST_Purchaseintents_CreateAPurchaseIntent'
      tags:
      - purchaseintents
      description: Create a PurchaseIntent
      operationId: purchaseintents/create
  /api/purchaseintents/strategies:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GET_Purchaseintents_GetAllPurchaseIntentStrategies_200_response'
        '401':
          description: Unauthorized
      tags:
      - purchaseintents
      description: Get all PurchaseIntent Strategies
      operationId: get_all_purchase_intent_strategies
    post:
      security:
      - jwt: []
      - apikey: []
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseIntentStrategyResource'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POST_Purchaseintents_CreatePurchaseIntentStrategies'
      tags:
      - purchaseintents
      description: Create PurchaseIntent Strategies
      operationId: create_purchase_intent_strategies
  /api/purchaseintents/{id}:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          metas: {}
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PurchaseIntentResource'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - purchaseintents
      description: Get a PurchaseIntent
      operationId: purchaseintents/get
    patch:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        schema:
          type: string
        required: true
        in: path
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PATCH_Purchaseintents_UpdateAPurchaseIntent'
      tags:
      - purchaseintents
      description: Update a PurchaseIntent
      operationId: purchaseintents/update
  /api/public/purchaseintents/{id}:
    get:
      parameters:
      - name: secret
        required: true
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: id
        required: true
        schema:
