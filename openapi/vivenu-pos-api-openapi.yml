    CouponSingleResource:
      type: object
      properties:
        couponType:
          type: string
          enum:
          - coupon
          default: coupon
        _id:
          type: string
          description: The ID of the coupon.
        code:
          type: string
          nullable: true
          description: A random generated 8 char code use to redeem the coupon.
        sellerId:
          type: string
          description: The ID of the seller.
        customer:
          type: string
          nullable: true
          description: The customer that this promotion code can be used by.
        createdAt:
          type: string
          format: date-time
          description: The date the coupon was created.
        updatedAt:
          type: string
          format: date-time
          description: The date the coupon was last updated.
        __v:
          type: integer
        name:
          type: string
          maxLength: 200
          description: The Name for the coupon. Visible to public.
        singleUsage:
          type: boolean
          description: Whether this coupon can only be used once
        active:
          type: boolean
          description: Whether the coupon can be used
          default: true
        maxUsage:
          type: number
          format: float
          minimum: 0
          description: The max amount of usages. A usage is counted as a completed transaction that used the coupon.
          default: 1
        maxUsagePerEvent:
          type: number
          format: float
          minimum: 0
          nullable: true
          description: The max amount of usages per event. A usage is counted as a completed transaction that used the coupon.
        maxTickets:
          type: number
          format: float
          minimum: 0
          nullable: true
          description: The number of tickets that can be purchased with this coupon
        canBeCombined:
          type: boolean
          description: Whether this coupon can be combined with others within one transaction.
        discountType:
          type: string
          enum:
          - fix
          - var
          - fixPerItem
          - waiveFees
        discountValue:
          type: number
          format: float
          description: The amount of the discount in seller's currency. eg. 50.0 -> 50 EUR
        discountMaxValue:
          type: number
          format: float
          nullable: true
          description: When discountType is VAR the max amount of the discount in seller's currency
        allowAllEvents:
          type: boolean
          description: Whether the coupon can be used across all events
          default: true
        allowedEvents:
          type: array
          items:
            type: string
          description: The ID's of events where the coupon can be used
        allowAllTickets:
          type: boolean
          description: Whether the coupon can be used across all tickets within the events
          default: true
        allowedTickets:
          type: array
          items:
            type: string
          description: The ID's of the ticket types on which the coupon should be applied
        taggingEnabled:
          type: boolean
          description: Whether this coupon tags customers
        tags:
          type: array
          items:
            type: string
          description: Which tags to add to customers which bought with this coupon
        validFrom:
          type: string
          format: date-time
          nullable: true
          description: The date from which this coupon can be redeemed.
        validUntil:
          type: string
          format: date-time
          nullable: true
          description: The date until this coupon can be redeemed.
        limitMaxTicketsInCart:
          type: boolean
          description: Whether this coupon limits the max tickets in cart.
        maxTicketsInCart:
          type: number
          format: float
          nullable: true
          description: If limitMaxTicketsInCart is true, the amount of the max allowed tickets.
        minTicketsInCart:
          type: number
          format: float
          minimum: 0
          nullable: true
          description: The minimum number of tickets that need to be purchased with this coupon
        note:
          type: string
          nullable: true
          description: The Note for this coupon.
        revealAllowedTickets:
          type: boolean
          description: Whether this coupon reveals the allowed tickets.
        unlocks:
          type: array
          items:
            oneOf:
            - type: object
              properties:
                target:
                  type: string
                  enum:
                  - underShop
                eventId:
                  type: string
                  description: The ID of the event.
                underShopId:
                  type: string
                  description: The ID of the under shop.
              required:
              - target
              - eventId
              - underShopId
          description: The array of the resources unlocked by undershop.
      required:
      - name
    POST_Pos_CreateAPos:
      type: object
      properties:
        name:
          type: string
        posNo:
          type: string
          nullable: true
        printingType:
          type: string
      required:
      - name
      - printingType
    POSWithStatusResource:
      type: object
      properties:
        _id:
          type: string
          description: The ID of the POS
        sellerId:
          type: string
          description: The ID of the seller owning this POS
        active:
          type: boolean
          description: Whether the POS is active or not
        name:
          type: string
          description: The name of the POS
        posNo:
          type: string
          description: The number of the POS
        printingType:
          type: string
          enum:
          - EXTERNAL
          - DIRECT
          description: The printing type of the POS. DIRECT = direct printing. EXTERNAL = extenral printing.
          default: EXTERNAL
        restrictions:
          type: object
          properties:
            restrictXReportAccess:
              type: boolean
              description: Whether the code must be inserted in order to see the x reports
            restrictZReportAccess:
              type: boolean
              description: Whether the code must be inserted in order to generate a z report and to finish the session
            restrictDashboardAccess:
              type: boolean
              description: Whether the POS user can see the dashboard
            restrictInstantCancellation:
              type: boolean
              description: Whether POS user can cancel a transaction immediately
            code:
              type: string
              description: Code to unlock x and z reports if restricted
            restrictEventAccess:
              type: boolean
              description: Whether the POS user can only choose specific events and/or specific secret shops
            restrictPurchaseIntents:
              type: boolean
              description: Whether the POS user can manage purchase intents
              default: true
            restrictCustomerAccess:
              type: boolean
              description: Whether the POS user can manage customers and select them during transactions
            allowedEvents:
              type: array
              items:
                type: string
              description: An array of IDs of allowed events
          description: Restrictions of the POS
        signature:
          type: object
          properties:
            fiskaly:
              type: object
              properties:
                tssId:
                  type: string
                  description: The ID of the TSS
                clientId:
                  type: string
                  description: The  ID of the client
                state:
                  type: string
                  enum:
                  - UNINITIALIZED
                  - INITIALIZED
                  - DISABLED
                  description: The state of the TSS
              description: Fiskaly settings
          description: POS signature settings
        state:
          type: string
          enum:
          - disabled
          - active
          description: The state of the POS
        createdAt:
          type: string
          format: date-time
          description: An ISO timestamp indicating when the POS was created
        updatedAt:
          type: string
          format: date-time
          description: An ISO timestamp indicating when the POS was updated
        open:
          type: boolean
          description: Whether the POS session is opened
        sessionId:
          type: string
          description: The ID of the POS session if opened
      required:
      - _id
      - active
      - name
      - posNo
      - printingType
