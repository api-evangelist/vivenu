components:
  schemas:
    POSInfoResource:
      type: object
      properties:
        id:
          type: string
          description: The ID of the POS
        sellerId:
          type: string
          description: The ID of the seller owning this POS
        active:
          type: boolean
          description: Whether the POS is active or not
        name:
          type: string
          description: The name of the POS
        posNo:
          type: string
          description: The number of the POS
        printingType:
          type: string
          enum:
          - EXTERNAL
          - DIRECT
          description: The printing type of the POS. DIRECT = direct printing. EXTERNAL = extenral printing.
          default: EXTERNAL
        restrictions:
          type: object
          properties:
            restrictPurchaseIntents:
              type: boolean
              description: Whether the POS user can manage purchase intents
              default: true
          description: Restrictions exposed for POS info
      required:
      - id
      - sellerId
      - active
      - name
      - posNo
      - printingType
      - restrictions
    GET_Pos_GetScannableInformationForACode_200_response:
      oneOf:
      - type: object
        properties:
          type:
            type: string
            enum:
            - product
          resource:
            type: object
            properties:
              _id:
                type: string
                description: The ID of the product
              name:
                type: string
                description: The name of the product
              active:
                type: boolean
                description: Whether the product is active and can be distributed
                default: true
              isFulfillable:
                type: boolean
                description: Whether the product can be delivered
              type:
                type: string
                enum:
                - voucher
                - product
                - donation
                - membership
                - addOn
                description: The type of the product
              image:
                type: string
                nullable: true
                description: The image of the product
              description:
                type: string
                nullable: true
                description: The description of the product
              variants:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      description: The ID of the product variant of the product
                    name:
                      type: string
                      nullable: true
                      description: The Name of the product variant, defaults to product name if not specified
                    description:
                      type: string
                      nullable: true
                      description: A description of the variant
                    priceType:
                      type: string
                      enum:
                      - fixed
                      - range
                      default: fixed
                    price:
                      type: number
                      format: float
                      nullable: true
                      description: The price of the product
                    priceRange:
                      type: object
                      properties:
                        min:
                          type: number
                          format: float
                          minimum: 0
                          nullable: true
                          description: The minimum price of the product
                        max:
                          type: number
                          format: float
                          minimum: 0
                          nullable: true
                          description: The maximum price of the product
                    taxable:
                      type: boolean
                      description: Whether the product is taxable or not
                    taxRate:
                      type: number
                      format: float
                      description: The tax rate of the product
                    compareAtPrice:
                      type: number
                      format: float
                      nullable: true
                      description: The recommended retail price to compare with the actual price.
                    taxServiceTypeId:
                      type: string
                      nullable: true
                      description: The ID of the tax service of the product
                    gtin:
                      type: string
                      pattern: ^\d+$
                    localization:
                      type: object
                      description: Localization of the product for multiple languages
                  required:
                  - _id
                  - taxable
                description: An array of variants of the product
              categoryIds:
                type: array
                items:
                  type: string
                description: An array of categories to which the product belongs
              voucherSettings:
                type: object
                properties:
                  limitedValidityPeriod:
                    type: boolean
                    description: Whether the voucher should expire
                  validityConfig:
                    type: object
                    properties:
                      amount:
