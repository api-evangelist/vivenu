        description: The ID of the fund to search for
        in: query
        required: false
        style: form
        explode: true
      - name: name
        schema:
          description: The name of the fund to search for
          type: string
        description: The name of the fund to search for
        in: query
        required: false
        style: form
        explode: true
      - name: externalId
        schema:
          description: The external ID of the fund to search for
          type: string
        description: The external ID of the fund to search for
        in: query
        required: false
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
