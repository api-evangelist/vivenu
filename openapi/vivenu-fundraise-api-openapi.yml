          description: The external ID of the campaign to search for
          type: string
        description: The external ID of the campaign to search for
        in: query
        required: false
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  docs:
                    type: array
                    items:
                      $ref: '#/components/schemas/CampaignResource'
                  total:
                    type: number
                required:
                - docs
                - total
                additionalProperties: false
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - fundraise
      description: Get All Campaigns
      operationId: get_all_campaigns
    post:
      security:
      - jwt: []
      - apikey: []
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResource'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name of the campaign
                target:
                  description: The target (goal) amount and date of the campaign
                  type: object
                  properties:
                    amount:
                      description: The target amount of the campaign
                      type: number
                    date:
                      description: An ISO timestamp indicating when the campaign is planned to reach the goal (amount).
                      type: string
                      format: date-time
                  additionalProperties: false
                externalId:
                  description: The external ID of the campaign
                  type: string
              required:
              - name
              additionalProperties: false
      tags:
      - fundraise
      description: Create a Campaign
      operationId: create_a_campaign
  /api/fundraise/funds:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: top
        schema:
          default: 25
          description: A limit on the number of objects to be returned. Can range between 1 and 1000.
          type: integer
          minimum: 1
