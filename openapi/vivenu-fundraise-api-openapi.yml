openapi: 3.0.3
info:
  title: vivenu access-lists fundraise API
  description: vivenu API Documentation
  version: 1.0.0
  contact:
    name: vivenu GmbH
    url: https://vivenu.com
servers:
- url: https://vivenu.com
  description: Production API
- url: https://vivenu.dev
  description: Staging API
tags:
- name: fundraise
paths:
  /api/fundraise/campaigns:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: top
        schema:
          default: 25
          description: A limit on the number of objects to be returned. Can range between 1 and 1000.
          type: integer
          minimum: 1
          maximum: 1000
        description: A limit on the number of objects to be returned. Can range between 1 and 1000.
        in: query
        required: true
        style: form
        explode: true
      - name: skip
        schema:
          default: 0
          description: The number of objects to skip for the requested result
          type: integer
          minimum: 0
          maximum: 9007199254740991
        description: The number of objects to skip for the requested result
        in: query
        required: true
        style: form
        explode: true
      - name: _id
        schema:
          description: The ID of the campaign to search for
          type: string
        description: The ID of the campaign to search for
        in: query
        required: false
        style: form
        explode: true
      - name: name
        schema:
          description: The name of the campaign to search for
          type: string
        description: The name of the campaign to search for
        in: query
        required: false
        style: form
        explode: true
      - name: externalId
