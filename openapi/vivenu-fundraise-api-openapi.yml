      - jwt: []
      - apikey: []
      parameters:
      - name: id
        schema:
          type: string
          description: The ID of the campaign to update (can be external ID). In case of external ID, the external ID must be prefixed with 'externalId:'
        description: The ID of the campaign to update (can be external ID). In case of external ID, the external ID must be prefixed with 'externalId:'
        in: path
        required: true
      responses:
