                description: The name of the automation rule for carts of the event
              triggerType:
                type: string
                enum:
                - hasBeenAdded
                description: The trigger type of the automation rule.
              triggerTargetGroup:
                type: string
                description: The trigger target group of the rule. The ID of a ticket group
              thenType:
                type: string
                enum:
                - autoAdd
                - chooseFrom
                description: The type of thenType of the rule. autoAdd = is the type to add automatically to cart. chooseFrom = is the type to choose from e.g. another ticket group
              thenTargets:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      description: The ID of the then target
                    thenTargetGroup:
                      type: string
                      description: The ID of the ticket group 'then' refers to
                    thenTargetMin:
                      type: number
                      format: float
                      description: Minimum amount of tickets where the then action is valid
                    thenTargetMax:
                      type: number
                      format: float
                      description: Maximum amount of tickets where the then action is valid
                  required:
                  - _id
                description: The target of the then type
            required:
            - _id
            - name
            - triggerType
            - triggerTargetGroup
            - thenType
          description: An array of automation rules for carts of the event
        posDiscounts:
