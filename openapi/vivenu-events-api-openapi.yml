                  type: number
                  format: float
                  minimum: 0
                  nullable: true
                  description: The fixed fee per ticket that the reseller pays
                resellerFeeVar:
                  type: number
                  format: float
                  minimum: 0
                  nullable: true
                  description: The variable fee per ticket that the reseller pays
