components:
  schemas:
    POST_Events_SetTheSeatingEventIdOfAnEvent:
      type: object
      properties:
        seatMapId:
          type: string
        revisionId:
          type: string
      required:
      - seatMapId
      - revisionId
    PublicListingEventResource:
      type: object
      properties:
        _id:
          type: string
          description: The ID of the event
        url:
          type: string
          description: The url of the event
        name:
          type: string
          description: The name of the event
        image:
          type: string
          description: An image for the event
        slogan:
          type: string
          description: The slogan of the event
        sellerId:
          type: string
          description: The ID of the seller owning this event
        start:
          type: string
          format: date-time
          description: An ISO timestamp indicating when the event starts
        end:
          type: string
          format: date-time
          description: An ISO timestamp indicating when the event ends
        locationName:
          type: string
          description: The name of the location where the event takes place
        locationStreet:
          type: string
          description: The street of the location where the event takes place
        locationCity:
          type: string
          description: The city of the location where the event takes place
        locationPostal:
          type: string
          description: The postal code of the location where the event takes place
        locationCountry:
          type: string
          description: The country code of the location where the event takes place
        styleOptions:
          type: object
          properties:
            headerStyle:
              type: string
              description: Header style of the event page
              default: default
            brandOne:
              type: string
              description: First brand of the event
            brandTwo:
              type: string
              description: Second brand of the event
            hideLocationMap:
              type: boolean
              description: Whether the location map on the event page hide
            hideLocationAddress:
              type: boolean
              description: Whether the location address on the event page hide
            categoryAlignment:
              type: number
              format: float
              enum:
              - cascade
              - asTabs
              - boxes
              - ticketWizard
              - 0
              - 1
              - 2
              - 3
              description: The style of category alignment. 0 = cascade = categories among themselves. 1 = asTabs = categories as tabs. 2 = boxes = categories as boxes. 3 = ticket wizard = categories as ticket wizard if configured.
            showAvailabilityIndicator:
              type: boolean
              description: Whether the availability indicator on the event page should be shown
            availabilityIndicatorThresholds:
              type: array
              items:
                type: number
                format: float
              description: The availability indicator thresholds of the event
              default:
              - 0.3
              - 0.7
            showAvailable:
              type: boolean
              description: Whether to show availability of the time slot. Only applicable for time slot events.
            timeSlotsCheckoutSelection:
              type: string
              enum:
              - beforeTickets
              - afterTickets
              description: Time slots selection in checkout.
          description: Style options of the event page
          default:
            headerStyle: default
            hideLocationMap: false
            hideLocationAddress: false
            categoryAlignment: 0
            showAvailabilityIndicator: false
            availabilityIndicatorThresholds:
            - 0.3
            - 0.7
        accountSettings:
          type: object
          properties:
            _id:
              type: string
              description: The ID of the account settings of the event
            enforceAccounts:
              type: boolean
              description: Whether to enforce accounts for the event
              deprecated: true
            enforceAuthentication:
              type: string
              enum:
              - DISABLED
              - PREVENT_CHECKOUT
              - PREVENT_DETAILS_STEP
              description: Whether to enforce authentication for the event and how to enforce it
              default: DISABLED
          required:
          - _id
          description: Account settings of the event
        meta:
          type: object
          description: Custom key-value data. Metadata is useful for storing additional, structured information on an object.
        eventType:
          type: string
          enum:
          - SINGLE
          - GROUP
          - RECURRENCE
          - ROOT
          description: The type of the event. SINGLE = it is a single event. GROUP = the event is part of a group of events
          default: SINGLE
        childEvents:
          type: array
          items:
            type: string
          description: An array of IDs of child events
        daySchemeId:
          type: string
          description: The ID of the day scheme assigned to the event.
        rootId:
          type: string
          description: The id of the root event
        seoSettings:
          type: object
          properties:
            _id:
              type: string
              description: The ID of the SEO setting
            tags:
              type: array
              items:
                type: string
              description: An array of tags of the seo settings
            noIndex:
              type: boolean
              description: Whether the seo setting has no indexing
            title:
              type: string
              description: The title of the seo settings
            description:
              type: string
              description: The description of the seo settings
          required:
          - _id
          description: The search engine optimization settings of the event
        customSettings:
          type: object
          properties:
            _id:
              type: string
              description: The ID of the custom settings of the event
            hideTicketsInTransactionPage:
              type: boolean
              description: Whether the ticket types of the event should be visible on transaction page
            dontSendTicketMail:
              type: boolean
              description: Whether an email should be sent of tickets of the event
            dontSendBookingConfirmationMail:
              type: boolean
              description: Whether an email should be sent for booking confirmation
            customMailHeaderImage:
              type: string
              description: A custom header image of the mail for ticket types of the event
            customTransactionCompletionText:
              type: string
              description: A custom transaction completion text for completed transactions of the event
            disableAppleWallet:
              type: boolean
              description: 'Whether the Apple and Google Wallet functionality should be disabled on the event. Deprecated: use event.deliverySettings.wallet instead'
              deprecated: true
            disablePdfTickets:
              type: boolean
              description: 'Whether the PDF tickets download functionality should be disabled on the event. Deprecated: use event.deliverySettings.pdf instead'
              deprecated: true
            showStartDate:
              type: boolean
              description: Whether the start date of the event should be visible on listings
              default: true
            showStartTime:
              type: boolean
              description: Whether the start time of the event should be visible on listings
              default: true
            showEndDate:
              type: boolean
              description: Whether the end date of the event should be visible on listings
            showEndTime:
              type: boolean
              description: Whether the end time of the event should be visible on listings
            showTimeRangeInListing:
              type: boolean
              description: Whether the end time of the event should be visible on listings
              deprecated: true
            showTimeRangeInTicket:
              type: boolean
              description: Whether the time range of the event should be visible on ticket PDFs
            customCheckoutCSS:
              type: string
              description: Custom CSS styling of the checkout of the event
            useCustomCheckoutBrand:
              type: boolean
              description: Whether the checkout of the event should use custom brand
            customCheckoutBrand:
              type: string
              description: A custom checkout brand of the event
            hideLogoInCheckout:
              type: boolean
              description: Whether the logo should be hide on the checkout of the event
            customEventPageHTML:
              type: string
              description: A custom HTML of the event page
            customEventPageCSS:
              type: string
              description: A custom css styling of the event page
            customConfirmationPage:
              type: string
              description: A custom css styling of the event page
            hideSeatmapInCheckout:
              type: boolean
              description: Hides the seatmap from the ticket buyer even if seating ticket types are available
            dontSendBookingConfirmationSMS:
              type: boolean
              description: Whether a sms should be sent for booking confirmation
          required:
          - _id
          description: Custom settings of the event
          default: {}
        ticketSettings:
          type: object
          properties:
            cancellationStrategy:
              type: string
              enum:
              - disabled
              - freeTicketsOnly
              - withoutRefund
              description: Cancellation strategy of the ticket types
              default: disabled
            revealingSettings:
              type: object
              properties:
                enabled:
                  type: string
                  nullable: true
                  enum:
                  - ENABLED
                  - DISABLED
                beforeEvent:
                  type: object
                  properties:
                    target:
                      type: string
                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
              description: Barcode reveal settings of the event.
            transferSettings:
              type: object
              properties:
                mode:
                  type: string
                  enum:
                  - ALLOWED
                  - DISABLED
                  description: Ticket transfer mode.
                expiresAfter:
                  type: object
                  properties:
                    target:
                      type: string
                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
                  description: If 'mode = ALLOWED'. A relatve date specification until when ticket transfer is valid.
                retransferMode:
                  type: string
                  enum:
                  - ALLOWED
                  - DISABLED
                  description: Ticket retransfer mode.
                allowedUntil:
                  type: object
                  properties:
                    target:
                      type: string
                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
                  description: If 'mode = ALLOWED'. A relatve date specification until the end of the event where ticket transfer is possible.
                hardTicketsMode:
                  type: string
                  enum:
                  - ALLOWED
                  - DISABLED
                  description: If 'hardTicketsMode = ALLOWED' then hard tickets transfers allowed.
                seasonTicketMode:
                  type: string
                  enum:
                  - NO_RESTRICTION
                  - CHILDREN_ONLY
                  - GROUP_ONLY
                  description: Restrict how season tickets can be transferred.
                useSeasonCardTemplate:
                  type: boolean
                  description: Whether to use the season card template for individual tickets transferred from the season.
              description: Transfer settings of the ticket types
              default: {}
            upgradeSettings:
              type: object
              properties:
                enabled:
                  type: string
                  enum:
                  - ENABLED
                  - DISABLED
                  description: Whether ticket upgrade settings enabled.
                underShopMapping:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                        - tag
                      tag:
                        type: string
                        description: The customer tag
                      underShopId:
                        type: string
                        description: The ID of the under shop.
                    required:
                    - type
                    - tag
                    - underShopId
                  description: Mapping to define the under shop in which a ticket upgrade will be performed.
              description: Upgrade settings of the ticket types
            resellSettings:
              type: object
              properties:
                enabled:
                  type: string
                  nullable: true
                  enum:
                  - ENABLED
                  - DISABLED
                  description: Whether resell is enabled
                resellerFeeFix:
                  type: number
                  format: float
                  minimum: 0
                  nullable: true
                  description: The fixed fee per ticket that the reseller pays
                resellerFeeVar:
                  type: number
                  format: float
                  minimum: 0
                  nullable: true
                  description: The variable fee per ticket that the reseller pays
                buyerFeeFix:
                  type: number
                  format: float
                  minimum: 0
                  nullable: true
                  description: The fixed fee per ticket that the buyer pays
                buyerFeeVar:
                  type: number
                  format: float
                  minimum: 0
                  nullable: true
                  description: The variable fee per ticket that the buyer pays
                offerCreationStart:
                  type: object
                  properties:
                    target:
                      type: string
                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
                  nullable: true
                  description: A relative date specification of offers creation start.
                offerCreationEnd:
                  type: object
                  properties:
                    target:
                      type: string
                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
                  nullable: true
                  description: A relative date specification of offers creation end.
                salesStart:
                  type: object
                  properties:
                    target:
                      type: string
                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
                  nullable: true
                  description: A relative date specification of sales start.
                priceMarkup:
                  type: number
                  format: float
                  minimum: -0.5
                  maximum: 3
                  nullable: true
                  description: The markup applied to the price of each ticket bought on the secondary market.
                cartAutomationMode:
                  type: string
                  nullable: true
                  enum:
                  - BLOCKED
                  - INDIVIDUAL
                  description: Controls whether tickets involved in cart automations can be resold.
              description: Resell settings
            barcodeSettings:
              type: object
              properties:
                issueOfflineBarcodes:
                  type: string
                  enum:
                  - ENABLED
                  - DISABLED
                  description: Whether offline barcodes are enabled
              description: Barcode settings
            childEventMapping:
              type: array
              items:
                type: object
                properties:
                  childEventId:
                    type: string
                    description: The child event for this mapping
                  ticketTypeMapping:
                    type: object
                    description: Mapping between ticket types of the parent event and the child events
                  valueShare:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 1
                    nullable: true
                    description: The percentage value of this child event from the value of the parent event
                required:
                - childEventId
                - ticketTypeMapping
              description: Child event mapping
            seasonCardValueStrategy:
              type: string
              enum:
              - childValue
              - averagePerChild
              - sharePerChild
              description: The strategy used to determine the value of a child event in the context of the parent event
          description: The event ticket settings
          default: {}
        groups:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                description: The ID of of the ticket group of the event
              name:
                type: string
                description: The name of the ticket group of the event
              tickets:
                type: array
                items:
                  type: string
                description: An array of ID's of ticket types of the event
            required:
            - _id
            - name
            - tickets
          description: An array of groups of ticket types of the event
        underShopId:
          type: string
          description: The ID of the under shop of the event
        startingPrice:
          type: string
          description: The starting price of the event
        showStartDate:
          type: boolean
          description: Whether to show the start time of the event in listings or not
          default: true
        showEndDate:
          type: boolean
          description: Whether to show the end time of the event in listings or not
        showTimeRangeInListing:
          type: boolean
          description: Whether to show the end time of the event in listings or not
          deprecated: true
        availabilityIndicator:
          type: string
          enum:
          - green
          - yellow
          - red
          description: The availability of the event. It shows whether there are tickets available. green = Enough available tickets. yellow = The tickets are almost sold out. red = There are no more available tickets
        currency:
          type: string
          enum:
          - EUR
          - USD
          - GBP
          - AUD
          - CHF
          - THB
          - ILS
          - COP
          - MXN
          - DKK
          - NOK
          - SEK
          - QAR
          - CAD
          - ISK
          - GTQ
          - INR
          - DOP
          - SGD
          - PLN
          - SAR
          - TTD
          - ZAR
          - KYD
          - HKD
          - CZK
          - KRW
          - JPY
          - NZD
          - AED
          - MAD
          - TWD
          - BRL
          - BWP
          - NAD
          - KES
          - SCR
          - TRY
          - SZL
          - LSL
          - TZS
          - UGX
          - ZMW
          - ZWG
          - GHS
          - NGN
          - SLE
          - LRD
          - XOF
          - XAF
          - GEL
          - IDR
          - ARS
          - CRC
          - HUF
          - EGP
          - MYR
          - VND
          - PHP
          description: The currency of event tickets prices
        saleStatus:
          type: string
          enum:
          - onSale
          - planned
          - past
          - soldOut
          description: status of event sale
        timezone:
          type: string
          description: Timezone of event
        category:
          type: string
          description: ' '
        subCategory:
          type: string
          description: ' '
        resell:
          type: object
          properties:
            saleActive:
              type: boolean
              description: Whether the event has buying on the secondary market active.
            offerActive:
              type: boolean
              description: Whether the event has selling on the secondary market active.
            fees:
              type: object
              properties:
                buyerFeeFix:
                  type: number
                  format: float
                  description: The fixed fees charged for each ticket to the buyer.
                buyerFeeVar:
                  type: number
                  format: float
                  description: The variable fees charged to the buyer.
              description: Fee information
            priceMarkup:
              type: number
              format: float
              description: The markup applied to the price of each ticket bought on the secondary market.
          description: Resell information
        attributes:
          type: object
