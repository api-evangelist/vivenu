        name:
          type: string
          description: The name of the event
        slogan:
          type: string
          description: The slogan of the event
        description:
          type: string
          description: A description about the event. Description is in RichText - JSON format.
        locationName:
          type: string
          description: The name of the location where the event takes place
        locationStreet:
          type: string
          description: The street of the location where the event takes place
        locationCity:
          type: string
          description: The city of the location where the event takes place
        locationPostal:
          type: string
          description: The postal code of the location where the event takes place
        locationCountry:
          type: string
          description: The country code of the location where the event takes place
        image:
          type: string
          description: An image for the event
        ticketFooter:
          type: string
          description: A footer image for the ticket PDF of the event
        ticketBackground:
          type: string
          description: A background image for the ticket PDF of the event
        ticketShopHeader:
          type: string
          description: A header image for the ticket shop of the event
        groups:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                description: The ID of of the ticket group of the event
              name:
                type: string
                description: The name of the ticket group of the event
              tickets:
                type: array
                items:
                  type: string
                description: An array of ID's of ticket types of the event
            required:
            - _id
            - name
            - tickets
          description: An array of groups of ticket types of the event
        discountGroups:
          type: array
          items:
            type: object
            properties:
              _id:
                type: string
                description: The ID of the discount group of the event
              name:
                type: string
                description: The name of the discount group of the event
              rules:
                type: array
                items:
                  type: object
                  properties:
                    _id:
                      type: string
                      description: The ID of the discount group rule
                    group:
                      type: string
                      description: The ID of the discount group
                    type:
                      type: string
                      enum:
                      - ticketGroups
                      - cartSum
                      description: The type of the discount rule. ticketGroups is the type for tickets. cartSum is the type for sum of a cart
                      default: ticketGroups
                    min:
                      type: number
                      format: float
                      description: Minimum amount of tickets where the discount is valid
                    max:
                      type: number
                      format: float
                      description: Maximum amount of tickets where the discount is valid
                  required:
                  - _id
                  - min
                  - max
                description: An array of rules of the discount group
              discountType:
                type: string
                enum:
                - TOTAL
                - PERCENTAGE
                - fix
                - var
                - fixPerItem
                - waiveFees
                description: The type of the discount group. TOTAL = absolute discount. PERCENTAGE = percentage discount. fix = fixed discount. var = variable discount
                default: fix
              value:
                type: number
                format: float
                description: The value of the discount group
            required:
            - _id
            - name
            - value
          description: An array of discount groups of the event
        cartAutomationRules:
          type: array
