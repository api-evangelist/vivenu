                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
                  nullable: true
                  description: A relative date specification of offers creation start.
                offerCreationEnd:
                  type: object
                  properties:
                    target:
                      type: string
                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
                  nullable: true
                  description: A relative date specification of offers creation end.
                salesStart:
                  type: object
                  properties:
                    target:
                      type: string
                      nullable: true
                      description: The target of the relative date
                    unit:
                      type: string
                      enum:
                      - hours
                      - days
                      - weeks
                      - months
                      - years
                      description: The unit in which the offset is specified
                    offset:
                      type: integer
                      description: The offset to the date
                  required:
                  - unit
                  - offset
                  nullable: true
                  description: A relative date specification of sales start.
                priceMarkup:
                  type: number
                  format: float
                  minimum: -0.5
                  maximum: 3
                  nullable: true
                  description: The markup applied to the price of each ticket bought on the secondary market.
                cartAutomationMode:
                  type: string
                  nullable: true
                  enum:
                  - BLOCKED
                  - INDIVIDUAL
                  description: Controls whether tickets involved in cart automations can be resold.
