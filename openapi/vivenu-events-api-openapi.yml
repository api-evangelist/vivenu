                  valueShare:
                    type: number
                    format: float
                    minimum: 0
                    maximum: 1
                    nullable: true
                    description: The percentage value of this child event from the value of the parent event
                required:
                - childEventId
                - ticketTypeMapping
              description: Child event mapping
            seasonCardValueStrategy:
              type: string
              enum:
              - childValue
              - averagePerChild
              - sharePerChild
              description: The strategy used to determine the value of a child event in the context of the parent event
