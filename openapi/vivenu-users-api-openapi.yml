openapi: 3.0.3
info:
  title: vivenu access-lists users API
  description: vivenu API Documentation
  version: 1.0.0
  contact:
    name: vivenu GmbH
    url: https://vivenu.com
servers:
- url: https://vivenu.com
  description: Production API
- url: https://vivenu.dev
  description: Staging API
tags:
- name: users
paths:
  /api/users:
    get:
      security:
      - jwt: []
      parameters: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
      tags:
      - users
      description: Get all Users
      operationId: get_all_users
  /api/users/info:
    get:
      security:
      - jwt: []
      parameters: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
      tags:
      - users
      description: Get my User info
      operationId: get_my_user_info
  /api/users/rich:
    get:
      security:
      - jwt: []
      parameters:
      - name: skip
        required: false
        schema:
          type: number
          format: float
          metas: {}
        in: query
        style: form
        explode: true
      - name: top
        required: false
        schema:
          type: number
          format: float
          default: 25
          metas: {}
        in: query
        style: form
        explode: true
      - name: name
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: email
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: sellerAccess
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: organizationAccess
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: isAdmin
        required: false
        schema:
          type: boolean
          metas: {}
        in: query
        style: form
        explode: true
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - users
      description: Get Users rich
      operationId: get_users_rich
  /api/users/sellers:
    get:
      security:
      - jwt: []
      parameters: []
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
      tags:
      - users
      description: Get all Sellers of a User
      operationId: get_all_sellers_of_a_user
  /api/users/info/{id}:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        schema:
          type: string
        required: true
        in: path
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
      tags:
      - users
      description: Get User info
      operationId: get_user_info
  /api/users/password-reset/{token}:
    get:
      parameters:
      - name: token
        required: true
        schema:
          type: string
          metas: {}
        in: path
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      tags:
      - users
      description: Check if password reset exists
      operationId: check_if_password_reset_exists
    put:
      parameters:
      - name: token
        required: true
        schema:
          type: string
          minLength: 1
          metas: {}
        in: path
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password:
                  type: string
                  minLength: 10
              required:
              - password
              additionalProperties: false
      tags:
      - users
      description: Set password after reset
      operationId: set_password_after_reset
