  /api/users/login:
    post:
      parameters: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    format: jwt
                additionalProperties: false
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
