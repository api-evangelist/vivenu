  /api/users/{id}:
    put:
      security:
      - jwt: []
      parameters:
      - name: id
        schema:
          type: string
        required: true
        in: path
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PUT_Users_UpdateUserInfo'
      tags:
      - users
      description: Update User info
      operationId: update_user_info
    delete:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        schema:
          type: string
        required: true
        in: path
      responses:
        '200':
          description: OK
        '401':
          description: Unauthorized
      tags:
      - users
      description: Delete a User
      operationId: delete_a_user
  /api/users/{id}/logintype:
    put:
      security:
      - jwt: []
      parameters:
      - name: id
        schema:
          type: string
        required: true
        in: path
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                loginType:
                  type: string
                  enum:
                  - password
                  - identityprovider
              required:
              - loginType
              additionalProperties: false
      tags:
      - users
      description: Update User Login Type
      operationId: update_user_login_type
  /api/users/{userId}/sellers/add:
    put:
      security:
      - jwt: []
      parameters:
      - name: userId
        schema:
          type: string
        required: true
        in: path
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PUT_Users_AddSellerToAUser'
      tags:
      - users
      description: Add Seller to a User
      operationId: add_seller_to_a_user
  /api/users/{userId}/sellers/remove:
    delete:
      security:
      - jwt: []
      parameters:
      - name: userId
        schema:
          type: string
        required: true
        in: path
      responses:
        '200':
          description: OK
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DELETE_Users_RemoveASellerOfAUser'
      tags:
      - users
      description: Remove a Seller of a User
      operationId: remove_a_seller_of_a_user
components:
  schemas:
    PUT_Users_AddSellerToAUser:
      type: object
      properties:
        sellerId:
          type: string
        roleTypes:
          type: array
          items:
            type: string
            enum:
            - global/super_admin
            - global/admin
            - global/finance_manager
            - global/seller_manager
            - global/support_manager
            - seller/admin
            - seller/analyst
            - seller/support_specialist
            - seller/event_manager
            - seller/sales_manager
            - seller/attendee_manager
            - seller/billing_manager
            - seller/view_only
            - seller/it_manager
            - seller/marketing_manager
            - seller/marketing_specialist
            - seller/fundraising_manager
            - seller/developer
            - pos/user
          default: []
      required:
      - sellerId
    POST_Users_ChangeSellerOnUser:
      type: object
      properties:
        sellerId:
          oneOf:
          - type: string
            length: 24
          - type: string
            pattern: ^[a-z]+_.*$
      required:
      - sellerId
    POST_Users_UnsubscribeNotificationType:
      type: object
      properties:
        eventType:
          type: string
        deviceId:
          type: string
      required:
      - eventType
      - deviceId
    DELETE_Users_RemoveASellerOfAUser:
      type: object
      properties:
        sellerId:
          type: string
      required:
      - sellerId
    POST_Users_RefreshAuthenticationToken:
      type: object
      properties:
        posId:
          type: string
      nullable: true
    POST_Users_GetNotificationDeviceInfo:
      type: object
      properties:
        deviceId:
          type: string
      required:
      - deviceId
    PUT_Users_UpdateUserInfo:
      type: object
      properties:
        name:
          type: string
      required:
      - name
    POST_Users_SubscribeNotificationType:
      type: object
      properties:
        eventType:
          type: string
        deviceName:
          type: string
        deviceId:
          type: string
        token:
          type: string
      required:
      - eventType
      - deviceName
      - deviceId
      - token
    POST_Users_RequestAPasswordResetMail:
      type: object
      properties:
        email:
          type: string
          format: email
  securitySchemes:
    jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apikey:
      type: apiKey
      scheme: bearer
      in: header
      name: Authorization
    customer-jwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
    orgApiKey:
      type: apiKey
      scheme: bearer
      in: header
      name: Authorization
