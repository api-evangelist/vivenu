                    - BWP
                    - NAD
                    - KES
                    - SCR
                    - TRY
                    - SZL
                    - LSL
                    - TZS
                    - UGX
                    - ZMW
                    - ZWG
                    - GHS
                    - NGN
                    - SLE
                    - LRD
                    - XOF
                    - XAF
                    - GEL
                    - IDR
                    - ARS
                    - CRC
                    - HUF
                    - EGP
                    - MYR
                    - VND
                    - PHP
                    description: An ISO 4217 3-character code of the currency
                  fees:
                    type: object
                    properties:
                      ticketFee:
                        type: number
                        format: float
                      freeTicketFee:
                        type: number
                        format: float
                      cartFee:
                        type: number
                        format: float
                      freeCartFee:
                        type: number
                        format: float
                      posTicketFee:
                        type: number
                        format: float
                      posFreeTicketFee:
                        type: number
                        format: float
                  taxId:
                    type: string
                    nullable: true
                    description: The Tax-ID of the organization
              address:
                type: object
                properties:
                  fullAddress:
                    type: string
                    nullable: true
                    description: Optional full address
                  street:
                    type: string
                    nullable: true
                    description: The street of the address. Street name including number.
                  line2:
                    type: string
                    nullable: true
                    description: The additional field of the address.
                  postal:
                    type: string
                    nullable: true
                    description: The postal code of the address.
                  city:
                    type: string
                    nullable: true
                    description: The city of the address.
                  country:
                    type: string
                    nullable: true
                    description: The country of the address. An ISO 3166 country code.
                  state:
                    type: string
                    nullable: true
                    description: The state of the address. If applicable
              owner:
                type: string
                enum:
                - de_vivenu_gmbh
                - us_vivenu_inc
                - ch_vivenu_switzerland_gmbh
                description: Owner of the organization
            required:
            - name
            - image
        total:
          type: integer
