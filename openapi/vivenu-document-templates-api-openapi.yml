openapi: 3.0.3
info:
  title: vivenu access-lists document-templates API
  description: vivenu API Documentation
  version: 1.0.0
  contact:
    name: vivenu GmbH
    url: https://vivenu.com
servers:
- url: https://vivenu.com
  description: Production API
- url: https://vivenu.dev
  description: Staging API
tags:
- name: document-templates
paths:
  /api/document-templates:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: skip
        required: false
        schema:
          type: number
          format: float
          description: The number of objects to skip for the requested result
          metas: {}
        in: query
        style: form
        explode: true
      - name: top
        required: false
        schema:
          type: number
          format: float
          description: A limit on the number of objects to be returned. Can range between 1 and 1000.
          default: 25
          metas: {}
        in: query
        style: form
        explode: true
      - name: type
        required: false
        schema:
          oneOf:
          - type: string
            enum:
            - ticket
            - invoice
            - voucher
            - member-card
            - header-card
            description: The type of a document template to filter for
            metas: {}
          - type: array
            items:
              type: string
              enum:
              - ticket
              - invoice
              - voucher
              - member-card
              - header-card
              metas: {}
            description: An array of types of a document template to filter for
            metas: {}
          metas: {}
        in: query
        style: form
        explode: true
      - name: targets
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - thermal
            - digital
            - wallet
            metas: {}
          description: The targets of a document template to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: formats
        required: false
        schema:
          type: array
          items:
            type: string
            enum:
            - A4
            - LETTER
            - LEGAL
            - BOARDING-PASS
            - PLASTIC-CARD
            - CARD
            - LABEL
            - CUSTOM
            - APPLE
            - GOOGLE
            metas: {}
          description: The formats of a document template to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: title
        required: false
        schema:
          type: string
          description: The title of a document template to filter for
          metas: {}
        in: query
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GET_Document-templates_GetAllDocumentTemplates_200_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      tags:
      - document-templates
      description: Get all Document Templates
      operationId: document-templates/list
    post:
      security:
      - jwt: []
      - apikey: []
      parameters: []
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/POST_Document-templates_CreateADocumentTemplate_201_response'
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/POST_Document-templates_CreateADocumentTemplate'
      tags:
      - document-templates
      description: Create a Document Template
      operationId: document-templates/create
  /api/document-templates/print:
    get:
      parameters:
      - name: eventId
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: childEventId
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: ticketTypeId
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: productId
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: sellerId
        required: false
        schema:
          type: string
          metas: {}
        in: query
        style: form
        explode: true
      - name: target
        required: true
        schema:
          type: string
          enum:
          - thermal
          - digital
          - wallet
          description: The target of a document template to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: type
        required: true
        schema:
          type: string
          enum:
          - ticket
          - invoice
          - voucher
          - member-card
          - header-card
          description: The type of a document template to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: format
        required: true
        schema:
          type: string
          enum:
          - A4
          - LETTER
          - LEGAL
          - BOARDING-PASS
          - PLASTIC-CARD
          - CARD
          - LABEL
          - CUSTOM
          - APPLE
          - GOOGLE
          description: The format of a document template to filter for
          metas: {}
        in: query
        style: form
        explode: true
      - name: locale
        required: false
        schema:
          type: string
          enum:
          - de
          - de-CH
          - en
          - en-GB
          - en-AU
          - fr
          - es
          - es-MX
          - is
          - it
          - ru
          - pt
          - tr
          - nb
          - nl
          - pl
          - sv
          - sl
          - da
          - cs
          - lv
          - he
          - ar
          - th
          - ko
          - ja
          - zh-TW
          description: Get the document template for a specific language
          metas: {}
        in: query
        style: form
        explode: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GET_Document-templates_GetDocumentTemplates_200_response'
        '400':
          description: Bad Request
      tags:
      - document-templates
      description: Get Document Templates
      operationId: document-templates/resolve
  /api/document-templates/{id}:
    get:
      security:
      - jwt: []
      - apikey: []
      parameters:
      - name: id
        required: true
        schema:
          type: string
          metas: {}
        in: path
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GET_Document-templates_GetADocumentTemplate_200_response'
        '400':
          description: Bad Request
        '401':
