name: vivenu
description: >-
  vivenu is an enterprise-grade, API-first event ticketing platform for live
  entertainment — sports, music, festivals, and performing arts. It provides
  white-label ticketing infrastructure, a headless REST API with total access to
  every platform resource (events, tickets, transactions, dynamic pricing,
  inventory, checkouts, customers, purchase intents), real-time webhooks,
  prebuilt drop-in checkout and seatmap components, and a unified payments API
  spanning global payment gateways. Used by more than 1,000 organizers
  worldwide, vivenu GmbH is headquartered in Germany and backed by
  Balderton Capital. The public OpenAPI (450 paths, 504 schemas) is served from
  https://vivenu.com/api with a staging environment at https://vivenu.dev/api.
